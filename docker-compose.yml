services:
  postgres:
    image: postgres:16-alpine
    container_name: mcpic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcpic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mcpic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcpic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mcpic_pgdata:
